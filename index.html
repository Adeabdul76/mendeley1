<!doctype html>
<html lang="ms" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F3864">
  <!-- Stop the phone browser from auto-translating: the app already shows the language the worker chose -->
  <meta name="google" content="notranslate">
  <title>NaikTaraf.AI</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <img src="assets/logo.png" alt="" class="logo" width="40" height="40">
      <div class="brand">NaikTaraf<span class="brand-ai">.AI</span></div>
      <button type="button" id="start-again" class="start-again">Mula semula</button>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="input-bar" class="input-bar" hidden>
      <input id="code-input" type="text" maxlength="8" autocomplete="off"
             autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button type="submit" id="send-btn">Hantar</button>
    </form>
  </div>

  <noscript>
    <p class="noscript">Sila hidupkan JavaScript. / Please turn on JavaScript.</p>
  </noscript>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
